services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: presensi_app
    restart: always
    ports:
      - "8000:80"
    environment:
      APP_NAME: "PRESENSI RTH NEXUS"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: presensi_rfid
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_DRIVER: database
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
      - ./storage/app/public:/var/www/html/storage/app/public
    depends_on:
      - db
      - redis
    networks:
      - presensi_network

  db:
    image: mysql:8.0
    container_name: presensi_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: presensi_rfid
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - presensi_network

  redis:
    image: redis:7-alpine
    container_name: presensi_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - presensi_network

networks:
  presensi_network:
    driver: bridge

volumes:
  db_data:
  redis_data:
